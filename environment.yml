# The working env on Inara is the existing `learning_env` kernel (/coc/scratch/vchopra/learning_env).
# To recreate it elsewhere:  conda env create -f environment.yml && conda activate adaloop
name: adaloop
channels: [conda-forge, defaults]
dependencies:
  - python=3.13
  - pip
  - pip:
      - -e .
      - en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
