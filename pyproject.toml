[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaloop"
version = "0.0.1"
description = "Adaptive Looped VLM: controller picks visual-token budget k and loop count R"
requires-python = ">=3.10,<3.14"
dependencies = [
  "torch",
  "transformers>=5",
  "peft>=0.13,<0.19",
  "accelerate>=1.0,<1.12",
  "bitsandbytes>=0.43,<0.49",
  "numpy",
  "pyyaml",
  "pillow",
  "datasets",
  "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["adaloop*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
