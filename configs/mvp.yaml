model_id: thinkingmachines/TML-d24-varloop-research
# Only physical GPUs 0-3 may be used on Inara. One model copy needs 2 A40s, so each group runs one copy.
# full_baseline.yaml may override this on another server. Placement only: not part of the config hash.
gpu_groups: [[0, 1], [2, 3]]
device_map: balanced
# keys are visible-device indices (after CUDA_VISIBLE_DEVICES), not physical GPU ids
max_memory: {0: 35GiB, 1: 35GiB}
# a gpu_group is picked only if each of its GPUs has this much free memory. Placement only: not hashed.
min_free_gib: 38
# notebooks: model copies loaded (2 = one per gpu_group, needs all of them free) and dev items per benchmark for
# the sample runs. Neither changes one item's output, so neither is hashed.
n_copies: 2
sample_items: 20
res_px: 512
# system prompt and question suffix; the file's content replaces this value on load, so it is part of config_hash
prompts: prompts.yaml
# the reply ends with "ANSWER: <answer>"; only the text after the last marker is graded
answer_format: "ANSWER:"
# longest answer counted as answer_len_ok (never truncated); keep in step with the limit stated in prompts.yaml
answer_max_chars: 20
# chat template "Thinking effort level": a number in [0, 0.99] or none 0, minimal 0.1, low 0.2, medium 0.7, high 0.9, xhigh/max 0.99
reasoning_effort: 0.9
max_new_tokens: 512  # thinking needs room; the limit when think_budget is off or answer_prefill is set
# Thinking budget (null = off), used when answer_prefill is null. Thinking still open after think_budget new tokens:
# the answer message is opened with answer_format and at most forced_answer_tokens are generated. Thinking closed in
# time: the model goes on to its own end, at most think_budget + answer_extra_tokens new tokens in total.
think_budget: 256
answer_extra_tokens: 32
forced_answer_tokens: 16
# Option: start of the model reply, appended to the prompt. null = the model thinks first and stops by itself.
# A prefill ending in <|content_text|> opens the answer message, and generation then also stops at <|end_message|>.
answer_prefill: null
out_dir: execution_results/mvp
# bump when a code change alters outputs for the same config (generation, extraction, scoring)
code_version: 5

benchmarks:
  gqa:
    source: lmms-lab-encoder/GQA
    questions_config: testdev_balanced_instructions
    images_config: testdev_balanced_images
    hf_split: testdev
    manifest: configs/splits/mvp_gqa.json
  textvqa:
    source: lmms-lab-encoder/textvqa
    hf_split: validation
    manifest: configs/splits/mvp_textvqa.json

# Per benchmark, image-disjoint. Images are split by fraction, then questions are sampled per split.
# lora_train size null = every remaining question.
splits:
  seed: 42
  sizes: {test: 500, ctrl_train: 300, dev: 100, lora_train: null}
  image_fracs: {test: 0.25, ctrl_train: 0.15, dev: 0.10, lora_train: 0.50}
