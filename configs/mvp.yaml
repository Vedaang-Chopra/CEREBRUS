model_id: thinkingmachines/TML-d24-varloop-research
# Only physical GPUs 0-3 may be used on Inara. One model copy needs 2 A40s, so each group runs one copy.
# full_baseline.yaml may override this on another server. Placement only: not part of the config hash.
gpu_groups: [[0, 1], [2, 3]]
device_map: balanced
# keys are visible-device indices (after CUDA_VISIBLE_DEVICES), not physical GPU ids
max_memory: {0: 35GiB, 1: 35GiB}
# a gpu_group is picked only if each of its GPUs has this much free memory. Placement only: not hashed.
min_free_gib: 38
res_px: 512
max_new_tokens: 128  # thinking is still on; stage S2 lowers this to 16
# Start of the model reply, appended to the prompt. Set after Vedaang picks a variant in notebooks/04_thinking_off
# (log it in docs/decisions.md).
answer_prefill: null
out_dir: execution_results/mvp
# bump when a code change alters outputs for the same config (generation, extraction, scoring)
code_version: 3

# prompt_suffix = the lmms-eval post_prompt of the task ("\nAnswer the question using a single word or phrase.")
# plus " Output only the answer." (added here). Sources, EvolvingLMMs-Lab/lmms-eval @ 9134731f4f617e62ee80bcae9d0d5d9695ea55ef:
#   gqa:     lmms_eval/tasks/gqa/gqa.yaml, lmms_eval_specific_kwargs.default.post_prompt
#   textvqa: lmms_eval/tasks/textvqa/_default_template_textvqa_yaml, lmms_eval_specific_kwargs.default.post_prompt
benchmarks:
  gqa:
    prompt_suffix: "\nAnswer the question using a single word or phrase. Output only the answer."
    source: lmms-lab-encoder/GQA
    questions_config: testdev_balanced_instructions
    images_config: testdev_balanced_images
    hf_split: testdev
    manifest: configs/splits/mvp_gqa.json
  textvqa:
    prompt_suffix: "\nAnswer the question using a single word or phrase. Output only the answer."
    source: lmms-lab-encoder/textvqa
    hf_split: validation
    manifest: configs/splits/mvp_textvqa.json

# Per benchmark, image-disjoint. Images are split by fraction, then questions are sampled per split.
# lora_train size null = every remaining question.
splits:
  seed: 42
  sizes: {test: 500, ctrl_train: 300, dev: 100, lora_train: null}
  image_fracs: {test: 0.25, ctrl_train: 0.15, dev: 0.10, lora_train: 0.50}
