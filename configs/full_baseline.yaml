extends: mvp.yaml

out_dir: execution_results/full_baseline
# the full baseline uses every visual token; without this line it would inherit divprune and its config hash (and finished result files) would change
compressor: none
# gpu_groups: inherited from mvp.yaml ([[0, 1], [2, 3]]: notebooks and sample runs stay on physical GPUs 0-3).
# `scripts/mvp.py full` only: one shard per group over GPUs 0-7 (big run, docs/decisions.md). Placement only: not hashed.
full_gpu_groups: [[0, 1], [2, 3], [4, 5], [6, 7]]
# test stays off until stage S12 (DEC3 §9)
run_splits: [dev, ctrl_train]
run_benchmarks: [gqa, textvqa]
k_grid: [1.0]
R_grid: [1, 2, 3, 4, 5]
# 1 is the reference path; notebooks/06 checks batched answers match first
batch_size: 8
